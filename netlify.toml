[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 301

[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 301

[[redirects]]
  from = "/produtos/morango-champagner/"
  to = "/catalogo.html?linha=recovery"
  status = 301
